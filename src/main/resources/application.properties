spring.application.name=VoucherView

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://34.47.83.48:3306/voucherview?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=inu.voucherview.domain
mybatis.configuration.map-underscore-to-camel-case=true

# Spring Security (disable for development)
spring.security.user.name=user
spring.security.user.password=password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
# Kakao OAuth Configuration
kakao.client.id=${KAKAO_CLIENT_ID:}
kakao.client.secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect.uri=${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Naver Map API Configuration
naver.map.client-id=${NAVER_MAP_CLIENT_ID:}
naver.map.client-secret=${NAVER_MAP_CLIENT_SECRET:}